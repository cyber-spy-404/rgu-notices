name: Twice-Daily Raiganj University Notice Scan

on:
  schedule:
    # 01:30 UTC = 07:00:00 AM IST
    # 13:30 UTC = 07:00:00 PM (19:00:00) IST
    - cron: '30 1,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
    inputs:
      force_send_sample:
        description: 'Send latest notice as test email'
        required: false
        type: boolean
        default: true
  repository_dispatch: # Allows external webhook pingers (cron-job.org) to trigger instantly
    types: [daily_check, cron_trigger]

jobs:
  check-notices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 7:00 AM & 7:00 PM Notice Scraper & Dispatcher
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GOOGLE_GROUP_EMAIL: ${{ secrets.GOOGLE_GROUP_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_SEND_SAMPLE: ${{ github.event.inputs.force_send_sample }}
        run: |
          python cron_task.py

      - name: Persist Seen Notices Cache (Safe Non-Sensitive IDs Only)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_ids.txt
          git diff --staged --quiet || (git commit -m "chore: update seen notice ids [skip ci]" && git push) || true
