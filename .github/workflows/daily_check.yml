name: Daily Raiganj University Notice Scan

on:
  schedule:
    # Runs at 18:28 UTC every day (which is 23:58:00 IST - 2 minutes before midnight to wake sleeping servers)
    - cron: '28 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
    inputs:
      force_send_sample:
        description: 'Send latest notice as test email'
        required: false
        type: boolean
        default: true

jobs:
  check-notices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 00:00 Notice Scraper & Dispatcher
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GOOGLE_GROUP_EMAIL: ${{ secrets.GOOGLE_GROUP_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_SEND_SAMPLE: ${{ github.event.inputs.force_send_sample }}
        run: |
          python cron_task.py

      - name: Persist Seen Notices Cache (Safe Non-Sensitive IDs Only)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_ids.txt
          git diff --staged --quiet || (git commit -m "chore: update seen notice ids [skip ci]" && git push) || true
